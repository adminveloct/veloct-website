name: Bug
description: Laporkan sesuatu yang tidak berjalan sebagaimana mestinya
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: kejadian
    attributes:
      label: Apa yang terjadi?
    validations:
      required: true
  - type: textarea
    id: harapan
    attributes:
      label: Apa yang seharusnya terjadi?
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah untuk mengulang
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: lingkungan
    attributes:
      label: Perangkat dan browser
      description: "Contoh: Windows 11, Chrome 130"
  - type: textarea
    id: bukti
    attributes:
      label: Tangkapan layar atau log
